name: flatpak

# Validates the AppStream metainfo that Flathub consumes. The package itself is
# built on Flathub: the manifest in this repository only holds placeholders for
# the release archive URLs and checksums.
on:
  push:
    branches:
      - master
    paths:
      - "flatpak/fr.cnil.PIA.metainfo.xml"
      - ".github/workflows/flatpak.yml"
  pull_request:
    paths:
      - "flatpak/fr.cnil.PIA.metainfo.xml"
      - ".github/workflows/flatpak.yml"
  workflow_dispatch:

jobs:
  metainfo:
    name: Validate AppStream metainfo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AppStream
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream

      - name: Validate AppStream metainfo
        run: appstreamcli validate --no-net flatpak/fr.cnil.PIA.metainfo.xml
