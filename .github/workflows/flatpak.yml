name: flatpak

# Builds and validates the Flatpak package on a Linux runner so it can be
# checked without a local Linux environment (e.g. when developing on macOS).
on:
  push:
    branches:
      - master
    paths:
      - "flatpak/**"
      - "electron/icons/icon.png"
      - "LICENSE"
      - ".github/workflows/flatpak.yml"
  pull_request:
    paths:
      - "flatpak/**"
      - "electron/icons/icon.png"
      - "LICENSE"
      - ".github/workflows/flatpak.yml"
  workflow_dispatch:

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      # Freedesktop runtime image matching the manifest runtime-version (26.08)
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
      # Docker copies the preinstalled SDK into a fresh volume so Flatpak
      # can rename its deployments during updates without overlayfs EXDEV.
      volumes:
        - /var/lib/flatpak
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # flatpak-builder-lint ships with the container image. It also checks
      # that the app-id domain (https://cnil.fr) is reachable, so the following
      # steps still run when it fails.
      - name: Lint manifest
        run: flatpak-builder-lint manifest flatpak/fr.cnil.PIA.yml

      - name: Validate AppStream metainfo
        if: ${{ !cancelled() }}
        run: appstreamcli validate --no-net flatpak/fr.cnil.PIA.metainfo.xml

      # NOTE: the build downloads the prebuilt tar.gz referenced in the manifest,
      # so it only fully succeeds once a matching Release archive (url + sha256)
      # is published.
      - name: Build Flatpak
        if: ${{ !cancelled() }}
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: fr.cnil.PIA.flatpak
          manifest-path: flatpak/fr.cnil.PIA.yml
          cache-key: flatpak-builder-${{ github.sha }}
